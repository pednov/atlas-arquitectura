name: Observatório (respostas ao questionário)

# Compila de hora a hora as respostas ao questionário do Observatório guardadas no Netlify, só com as que vieram
# da página do ATLAS (pedido do Pedro, 20 Nov. 2026). Precisa do segredo NETLIFY_TOKEN; sem ele não faz nada.
# Só grava no repositório quando a compilação muda.

on:
  schedule:
    - cron: '41 * * * *'        # de hora a hora, aos 41 minutos (UTC)
  workflow_dispatch:            # permite correr à mão, em Actions > Observatório > Run workflow

permissions:
  contents: write

concurrency:
  group: observatorio
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar
        run: pip install requests
      - name: Compilar as respostas
        run: python scripts/observatorio.py
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
      - name: Gravar no repositório
        run: |
          git config user.name "atlas-recolha"
          git config user.email "atlas-recolha@users.noreply.github.com"
          git add data/observatorio-respostas.json data/observatorio-arquivo 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Observatório: respostas compiladas $(date -u +'%F %H:%M')"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
