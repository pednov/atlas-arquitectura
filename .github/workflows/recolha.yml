name: Recolha diária

on:
  schedule:
    - cron: '17 5 * * *'        # todos os dias às 05:17 (UTC)
  workflow_dispatch:            # permite correr à mão, em Actions > Recolha diária > Run workflow

permissions:
  contents: write

concurrency:
  group: recolha
  cancel-in-progress: false

jobs:
  recolha:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Instalar
        run: pip install -r scripts/requirements.txt
      - name: Recolher concursos e notícias
        run: python scripts/actualizar.py
      - name: Instalar o navegador sem janela (para o SILUC e o Divisare)
        run: python -m playwright install --with-deps chromium
        continue-on-error: true
      - name: Recolher os fotógrafos de arquitectura (Divisare, uma vez por semana)
        run: python scripts/fotografos.py
        continue-on-error: true
      - name: Recolher a legislação (SILUC)
        run: python scripts/siluc.py
        continue-on-error: true
      - name: Recolher as ofertas da bolsa de emprego
        run: python scripts/emprego.py
        continue-on-error: true
      - name: Gravar no repositório
        run: |
          git config user.name "atlas-recolha"
          git config user.email "atlas-recolha@users.noreply.github.com"
          git add data ultima-recolha.txt   # as respostas do Observatório compilam-se à parte, em observatorio.yml
          git diff --cached --quiet || git commit -m "Recolha diária $(date -u +%F)"
          git pull --rebase --autostash || true      # se entretanto entrou outra alteração no repositório
          git push
