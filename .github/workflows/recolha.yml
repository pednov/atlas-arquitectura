name: Recolha diária

on:
  schedule:
    - cron: '17 5 * * *'        # todos os dias às 05:17 (UTC)
  workflow_dispatch:            # permite correr à mão, em Actions > Recolha diária > Run workflow

permissions:
  contents: write

concurrency:
  group: recolha
  cancel-in-progress: false

jobs:
  recolha:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Instalar
        run: pip install -r scripts/requirements.txt
      - name: Recolher concursos e notícias
        run: python scripts/actualizar.py
      - name: Gravar no repositório
        run: |
          git config user.name "atlas-recolha"
          git config user.email "atlas-recolha@users.noreply.github.com"
          git add data ultima-recolha.txt
          git diff --cached --quiet || git commit -m "Recolha diária $(date -u +%F)"
          git push
